 <div class="tx"><h3>${esc(p.name)}</h3><small>${p.mat} · ${p.shape==="cat"?"Cat-eye":p.shape[0].toUpperCase()+p.shape.slice(1)} · 52-18-140</small><p>${esc(p.desc)}</p>
 <div class="buy"><div class="price">${money(p.price)}${p.old?`<s>${money(p.old)}</s>`:""}</div><button class="btn sm" data-add="${p.id}">Add to cart</button></div></div></article>`};
const F={sort:"",shape:""};
function listing(cid){let a=ALL.filter(p=>p.cid===cid);if(F.shape)a=a.filter(p=>p.shape===F.shape);
 if(F.sort==="lo")a.sort((x,y)=>x.price-y.price);if(F.sort==="hi")a.sort((x,y)=>y.price-x.price);if(F.sort==="rt")a.sort((x,y)=>y.rate-x.rate);
 return a.length?a.map(card).join(""):'<p>No frames match this filter. Try another shape.</p>'}
const PAGES={home:()=>`<section class="hero"><div><h1>${esc(SITE.tagline)}</h1><p>${esc(SITE.intro)}</p><a class="btn" href="#iconic">Shop frames</a> <a class="btn alt" href="#contact">Talk to us</a></div><div class="ph">${photo(ALL[5],1)}</div></section>
 <section class="trust">${SITE.trust.map(t=>`<div><h3>${esc(t[0])}</h3><p>${esc(t[1])}</p></div>`).join("")}</section>
 <section class="sec"><h2>Shop by collection</h2><div class="tiles">${CATS.map(c=>`<a class="tile" href="#${c.id}"><div class="im">${photo(byId(c.id+"0"),0)}</div><div class="tx"><h3>${esc(c.name)}</h3><p>${esc(c.blurb)}</p></div></a>`).join("")}</div></section>
 <section class="sec"><div class="sechead"><h2>Bestsellers</h2></div><div class="grid">${["maira0","iconic1","jorge0","hustlr1"].map(i=>card(byId(i))).join("")}</div></section>
 <section class="sec"><h2>How it works</h2><div class="cols">${SITE.steps.map((s,i)=>`<div class="step"><b>${i+1}</b><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("")}</div></section>
 <section class="sec"><div class="band"><h2>About ${esc(SITE.brand)}</h2>${SITE.about.map(a=>`<p>${esc(a)}</p>`).join("")}<div class="cols" style="margin-top:18px">${SITE.points.map(p=>`<div><h3>${esc(p[0])}</h3><p style="margin:0;color:var(--mute)">${esc(p[1])}</p></div>`).join("")}</div></div></section>`,
 contact:()=>`<div class="pagehead"><h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">We are happy to help</h1><p>${esc(SITE.contactIntro)}</p></div>
 <div class="contact"><div class="box"><h3>Reach us</h3><p><strong>Address</strong><br>${esc(SITE.address)}</p><p><strong>Email</strong><br><a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></p><p><strong>Phone</strong><br><a href="tel:+91${esc(SITE.phone)}">${esc(SITE.phone)}</a></p><p><strong>Hours</strong><br>${esc(SITE.hours)}</p>
 <p><strong>Social media</strong><br>${SITE.social.length?SITE.social.map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(", "):"Our social pages are coming soon."}</p></div>
 <div class="box"><h3>Send an enquiry</h3><form id="enq"><label for="n">Your name</label><input id="n" required><label for="e">Email</label><input id="e" type="email" required><label for="p">Phone</label><input id="p" type="tel"><label for="t">Interested in</label><select id="t"><option>General question</option>${CATS.map(c=>`<option>${esc(c.name)}</option>`).join("")}<option>An existing order</option></select><label for="m">Message</label><textarea id="m" rows="4" required></textarea><p style="margin:14px 0 0"><button class="btn" type="submit">Send enquiry</button></p></form></div></div>`};
CATS.forEach(c=>PAGES[c.id]=()=>{F.sort="";F.shape="";const sh=[...new Set(ALL.filter(p=>p.cid===c.id).map(p=>p.shape))];
 return`<div class="pagehead"><h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">${esc(c.name)}</h1><p>${esc(c.intro)}</p></div>
 <div class="bar"><select id="sort" aria-label="Sort"><option value="">Sort: Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="rt">Top rated</option></select><button class="chip on" data-shape="">All shapes</button>${sh.map(s=>`<button class="chip" data-shape="${s}">${s==="cat"?"Cat-eye":s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</div><div class="grid sec" id="lst" style="padding-top:6px" data-cid="${c.id}">${listing(c.id)}</div>`});
function route(){const h=(location.hash||"#home").slice(1);let pg=PAGES[h]?h:"home",html;
 if(h.startsWith("search=")){pg="";const t=decodeURIComponent(h.slice(7)).toLowerCase(),r=ALL.filter(p=>(p.name+p.cat+p.shape+p.desc+p.mat).toLowerCase().includes(t));html=`<div class="pagehead"><h1 style="font-size:1.8rem">Results for “${esc(t)}”</h1></div><div class="grid sec">${r.length?r.map(card).join(""):"<p>No frames found. Try “round”, “black” or “aviator”.</p>"}</div>`}else html=PAGES[pg]();
 $("#app").innerHTML=html;document.title=(pg&&pg!=="home"?(CATS.find(c=>c.id===pg)||{name:"Contact"}).name+" | ":"")+SITE.brand;
 $("#nav").innerHTML=[["home","Home"],...CATS.map(c=>[c.id,c.name]),["contact","Contact Us"]].map(n=>`<a href="#${n[0]}" class="${n[0]===pg?"on":""}">${esc(n[1])}</a>`).join("");
 window.scrollTo(0,0);const f=$("#enq");if(f)f.onsubmit=e=>{e.preventDefault();location.href=`mailto:${SITE.email}?subject=${encodeURIComponent("Enquiry: "+$("#t").value)}&body=${encodeURIComponent($("#m").value+"\n\nName: "+$("#n").value+"\nEmail: "+$("#e").value+"\nPhone: "+$("#p").value)}`;toast("Opening your email app…")}}
$("#app").onclick=e=>{const a=e.target.closest("[data-add]");if(a)return add(a.dataset.add);
 const d=e.target.closest(".dots button");if(d){const c=d.closest(".card"),p=byId(c.dataset.p);c.querySelector(".im").firstElementChild.outerHTML=photo(p,+d.dataset.v);c.querySelectorAll(".dots button").forEach(b=>b.classList.toggle("on",b===d));return}
 const s=e.target.closest("[data-shape]");if(s){F.shape=s.dataset.shape;document.querySelectorAll("[data-shape]").forEach(b=>b.classList.toggle("on",b===s));$("#lst").innerHTML=listing($("#lst").dataset.cid)}};
$("#app").onchange=e=>{if(e.target.id==="sort"){F.sort=e.target.value;$("#lst").innerHTML=listing($("#lst").dataset.cid)}};
$("#sf").onsubmit=e=>{e.preventDefault();const t=$("#q").value.trim();if(t)location.hash="search="+encodeURIComponent(t)};
$("#ann").textContent=SITE.announce;$("#brandlink").innerHTML=logo+`<span>${esc(SITE.brand)}</span>`;
$("#foot").innerHTML=`<div><h3>${esc(SITE.brand)}</h3><p>${esc(SITE.tagline)}</p></div><div><h3>Collections</h3>${CATS.map(c=>`<a href="#${c.id}">${esc(c.name)}</a>`).join("")}</div><div><h3>Contact</h3><a href="tel:+91${SITE.phone}">${SITE.phone}</a><a href="mailto:${SITE.email}">${SITE.email}</a><span>${esc(SITE.address)}</span></div>`;
addEventListener("hashchange",route);route();draw();
</script></body></html>
